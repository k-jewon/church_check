<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>church_check 운영</title>
    <style>
      body { font-family: system-ui, "Segoe UI", sans-serif; color: #1f2328; background: #fff; max-width: 420px; margin: 20px auto; }
      h1 { font-size: 17px; margin: 0 0 12px; }
      #status { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; color: #475569; }
      #status.on { background: #e6f6ec; color: #1a7f37; }
      fieldset { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin: 14px 0; }
      legend { font-size: 12px; color: #6b7280; padding: 0 4px; }
      .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
      button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; color: #1f2328; }
      button:hover:not(:disabled) { background: #eef1f4; }
      button.primary { background: #1a7f37; border-color: #1a7f37; color: #fff; }
      button.primary:hover:not(:disabled) { background: #166a2e; }
      button:disabled { opacity: 0.45; cursor: default; }
      input { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; width: 150px; }
      #msg { font-size: 13px; color: #333; white-space: pre-wrap; margin: 12px 0 0; min-height: 18px; }
      #msg.err { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>church_check 운영</h1>
    <p id="status">상태 확인 중…</p>

    <fieldset>
      <legend>서버</legend>
      <div class="row">
        <button id="start" class="primary">서버 시작</button>
        <button id="stop">서버 멈춤</button>
      </div>
      <div class="row">
        <button id="attendance">출석 화면 열기</button>
        <button id="qr">폰 접속(QR)</button>
        <button id="update">업데이트</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>암호</legend>
      <div class="row">
        <input id="inputPw" type="password" placeholder="입력용 암호" />
        <button id="saveInput">저장</button>
      </div>
      <div class="row">
        <input id="adminPw" type="password" placeholder="관리자 암호" />
        <button id="saveAdmin">저장</button>
      </div>
    </fieldset>

    <p id="msg"></p>

    <script>
      const { ipcRenderer } = require('electron');
      const statusEl = document.getElementById('status');
      const msgEl = document.getElementById('msg');
      const running = () => statusEl.textContent.startsWith('서버 실행 중');

      function paint() {
        statusEl.classList.toggle('on', running());
        document.getElementById('start').disabled = running();
        document.getElementById('stop').disabled = !running();
        document.getElementById('attendance').disabled = !running();
        document.getElementById('qr').disabled = !running();
      }

      async function run(action, arg) {
        if (action === 'status') {
          statusEl.textContent = await ipcRenderer.invoke('control', action);
          paint();
          return;
        }
        msgEl.textContent = '처리 중…';
        msgEl.className = '';
        const result = await ipcRenderer.invoke('control', action, arg);
        msgEl.textContent = result;
        msgEl.className = result.startsWith('[중단]') ? 'err' : '';
        statusEl.textContent = await ipcRenderer.invoke('control', 'status');
        paint();
        if (action === 'setpw') arg.target.value = '';
      }

      // 버튼 id와 IPC 액션 이름은 다르다(출석 화면 버튼 id는 window.open과 겹치지 않게 attendance).
      const actions = { start: 'start', stop: 'stop', attendance: 'open', qr: 'qr', update: 'update' };
      for (const [id, action] of Object.entries(actions)) {
        document.getElementById(id).addEventListener('click', () => run(action));
      }
      document.getElementById('saveInput').addEventListener('click', () =>
        run('setpw', { which: 'input', pw: document.getElementById('inputPw').value, target: document.getElementById('inputPw') }),
      );
      document.getElementById('saveAdmin').addEventListener('click', () =>
        run('setpw', { which: 'admin', pw: document.getElementById('adminPw').value, target: document.getElementById('adminPw') }),
      );

      run('status');
    </script>
  </body>
</html>
